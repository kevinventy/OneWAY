name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL HTTPS de l'app deployee (Vercel)"
        required: false
        type: string
  push:
    branches:
      - claude/freight-marketplace-app-ymffso
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'www/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform/build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Determine app URL
        id: appurl
        env:
          INPUT_APP_URL: ${{ inputs.app_url }}
          VAR_APP_URL: ${{ vars.ONEWAY_APP_URL }}
        run: |
          if [ -n "$INPUT_APP_URL" ]; then
            APP_URL="$INPUT_APP_URL"
          else
            APP_URL="$VAR_APP_URL"
          fi
          echo "ONEWAY_APP_URL=$APP_URL" >> "$GITHUB_ENV"
          if [ -n "$APP_URL" ]; then
            echo "used_url=$APP_URL" >> "$GITHUB_OUTPUT"
          else
            echo "used_url=https://oneway.vercel.app (defaut Capacitor)" >> "$GITHUB_OUTPUT"
          fi

      - name: Capacitor sync (Android)
        env:
          ONEWAY_APP_URL: ${{ env.ONEWAY_APP_URL }}
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneway-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: ONE WAY APK build ${{ github.run_number }}
          body: |
            APK Android (debug) de l'app ONE WAY.

            - URL chargee par l'app : ${{ steps.appurl.outputs.used_url }}
            - Commit : ${{ github.sha }}
            - Run : #${{ github.run_number }}

            Telechargez `app-debug.apk` ci-dessous et installez-le sur un appareil Android
            (autorisez les sources inconnues). L'app charge l'URL distante indiquee ci-dessus.
          files: android/app/build/outputs/apk/debug/app-debug.apk
