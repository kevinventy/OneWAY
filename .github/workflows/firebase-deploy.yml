name: Firebase Deploy (Firestore)

# Déploie les règles de sécurité + index Firestore vers le projet oneway-77f85.
# Lancement MANUEL (Actions → Firebase Deploy → Run workflow) une fois l'un de
# ces secrets de dépôt défini :
#   - FIREBASE_TOKEN          → jeton CI (`firebase login:ci`), le plus simple
#   - FIREBASE_SERVICE_ACCOUNT → contenu JSON d'une clé de compte de service
# Prérequis côté console : la base Firestore doit déjà exister (mode production).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Firestore rules & indexes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy Firestore (rules + indexes)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            firebase deploy --only firestore --project oneway-77f85 --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only firestore --project oneway-77f85 --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Aucune authentification Firebase. Définissez le secret de dépôt FIREBASE_TOKEN (résultat de 'firebase login:ci') ou FIREBASE_SERVICE_ACCOUNT (JSON d'une clé de compte de service), puis relancez."
            exit 1
          fi
