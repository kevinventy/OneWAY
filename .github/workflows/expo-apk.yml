name: Expo APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/freight-marketplace-app-ymffso
    paths:
      - 'mobile/**'
      - '.github/workflows/expo-apk.yml'

permissions:
  contents: write

concurrency:
  group: expo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Expo Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Config Firebase embarquée (définissez ces Variables de dépôt pour une app fonctionnelle).
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install platform/build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Expo prebuild (génère le projet android natif)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (JS embarqué, signé debug)
        run: |
          chmod +x android/gradlew
          # Augmente le heap Gradle (la valeur par défaut d'Expo cause un OutOfMemoryError
          # sur le build RN release) ; la dernière clé écrase celle générée par prebuild.
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC" >> android/gradle.properties
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneway-expo-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: expo-apk-${{ github.run_number }}
          name: ONE WAY (Expo) APK build ${{ github.run_number }}
          body: |
            APK Android natif (Expo + Firebase) de l'app ONE WAY.

            - Firebase configuré : ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID != '' }}
            - Commit : ${{ github.sha }}

            Installez `app-release.apk` sur un appareil Android (sources inconnues autorisées).
            Sans Variables `EXPO_PUBLIC_FIREBASE_*` définies, l'app affiche « Firebase non configuré ».
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
