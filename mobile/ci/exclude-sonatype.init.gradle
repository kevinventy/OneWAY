// Retire le dépôt oss.sonatype.org de la résolution Gradle.
//
// Ce dépôt (legacy Sonatype OSS) renvoie par intermittence des 504 Gateway
// Time-out et est en cours de dépréciation ; quand il échoue, Gradle le
// désactive et fait échouer toute la résolution. Tous les artefacts requis
// (Fresco, kotlin-stdlib, etc.) sont sur Maven Central / Google.
//
// Le plugin Gradle de React Native ré-ajoute ce dépôt pendant la configuration
// des projets : on le retire donc le plus tard possible (projectsEvaluated),
// après tous les hooks de configuration, et aussi au niveau settings.

def isSonatype = { repo ->
    (repo instanceof MavenArtifactRepository) &&
    (repo.url != null) &&
    (repo.url.toString().contains('oss.sonatype.org'))
}

gradle.settingsEvaluated { settings ->
    try { settings.pluginManagement.repositories.removeAll { isSonatype(it) } } catch (ignored) {}
    try { settings.dependencyResolutionManagement.repositories.removeAll { isSonatype(it) } } catch (ignored) {}
}

gradle.projectsEvaluated {
    gradle.rootProject.allprojects { project ->
        project.repositories.removeAll { isSonatype(it) }
        try { project.buildscript.repositories.removeAll { isSonatype(it) } } catch (ignored) {}
    }
}
